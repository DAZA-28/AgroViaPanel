<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipo — AgroVia Panel</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">AgroVia Panel</div>
      <div class="sidebar-section">
        <a href="/" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          <span class="sidebar-link-label">Métricas</span>
        </a>
        <a href="/aprobaciones" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
          <span class="sidebar-link-label">Aprobaciones</span>
        </a>
        <a href="/pedidos" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3h2l.4 2M7 13h10l4-8H5.4" />
            <circle cx="9" cy="21" r="1.5" />
            <circle cx="18" cy="21" r="1.5" />
          </svg>
          <span class="sidebar-link-label">Pedidos en vivo</span>
        </a>
        <a href="#" class="sidebar-link is-disabled">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          <span class="sidebar-link-label">Salud del sistema (próximamente)</span>
        </a>
        <a href="/usuarios" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span class="sidebar-link-label">Usuarios</span>
        </a>
        <a href="/equipo.html" class="sidebar-link is-active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
          </svg>
          <span class="sidebar-link-label">Equipo</span>
        </a>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-divider"></div>
      <button class="sidebar-signout" id="btnSignOut">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span class="sidebar-link-label">Cerrar sesión</span>
      </button>
    </nav>

    <main class="app-main" style="position: relative;">
      <div class="ambient-glow" aria-hidden="true"></div>
      <div class="view-panel">
      <div class="page-header">
        <h1>Equipo</h1>
        <p>Staff con acceso al panel de AgroVia.</p>
      </div>

      <form class="card" id="formInvitar" style="margin-bottom: 24px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
        <div>
          <label class="cell-muted" style="display: block; font-size: 12px; margin-bottom: 4px;">Nombre</label>
          <input id="inputNombre" required style="background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 8px;" />
        </div>
        <div>
          <label class="cell-muted" style="display: block; font-size: 12px; margin-bottom: 4px;">Email</label>
          <input id="inputEmail" type="email" required style="background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 8px;" />
        </div>
        <button type="submit" id="btnInvitar" class="btn btn-primary">Invitar</button>
      </form>

      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Activo</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbodyEquipo">
          <tr class="empty-row"><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
      </div>
    </main>
  </div>

  <script type="module" src="/equipo.js"></script>
</body>
</html>
